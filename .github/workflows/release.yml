name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Run test suite
        run: |
          BUSYBASE_PORT=54329 bun run src/cli.ts serve &
          sleep 2
          BUSYBASE_URL=http://localhost:54329 bun run src/cli.ts test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: busybase-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: busybase-macos-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: busybase-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build standalone
        run: bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile=${{ matrix.artifact }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create latest artifacts/* \
            --title "Latest build (${{ github.sha }})" \
            --notes-file - \
            --latest <<'EOF'
          Automated build from commit ${{ github.sha }}

          **Downloads:**
          - `busybase-linux-x64` — Linux x64
          - `busybase-macos-arm64` — macOS Apple Silicon
          - `busybase-windows-x64.exe` — Windows x64
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
