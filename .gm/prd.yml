- id: mktbl-ensurecols-race
  subject: Race condition between openTbl/mkTbl/ensureCols on concurrent first insert
  notes: 'rest.ts POST handler: two concurrent requests inserting into a brand-new table can both see openTbl()==null and race CREATE TABLE IF NOT EXISTS (safe) but ensureCols column-add ALTER can race destructively if row shapes differ during table creation window. Fix: wrap create-or-ensure in a mutex per table name or guard duplicate-column ALTER errors explicitly.'
  status: completed
  witness: db.ts ensureTable() serializes create-or-add-columns per table name via a promise-chained lock keyed by table name; rest.ts POST now calls ensureTable instead of separate openTbl/mkTbl/ensureCols calls.
- id: hooks-file-dynamic-import-no-validation
