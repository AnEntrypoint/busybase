<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BusyBase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/anentrypoint-design@latest/dist/247420.css"/>
<style>
  body{margin:0;font-family:system-ui,sans-serif}
  .bb-nav-item{padding:.5rem 1rem;cursor:pointer;border-radius:.375rem;margin:.1rem .5rem;font-size:.875rem}
  .bb-nav-item:hover{background:rgba(127,127,127,.12)}
  .bb-nav-item.active{background:var(--ds-accent,#6366f1);color:#fff}
  .bb-cell-edit{outline:none;background:transparent;width:100%;font-size:.85rem;padding:2px 4px}
  .bb-toasts{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.5rem;max-width:320px}
  pre{background:#1e1e2e;color:#cdd6f4;padding:1rem;border-radius:.5rem;overflow:auto;font-size:.8rem;max-height:300px}
  .bb-editable-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .bb-editable-table th,.bb-editable-table td{padding:.4rem .6rem;white-space:nowrap;text-align:left;border-bottom:1px solid rgba(127,127,127,.15)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { h, webjsx, mount, components, initTheme } from "https://cdn.jsdelivr.net/npm/anentrypoint-design@latest/dist/247420.js";
const { Btn, TextField, Alert, Panel, Topbar, Side, AppShell } = components;

const S = {
  tab: "data",
  tables: [],
  activeTable: null,
  rows: [],
  schema: [],
  toasts: [],
  loading: false,
  sql: "",
  sqlResult: null,
  logs: [],
  editCell: null,
  newRow: {},
  newTableName: "",
  filter: "",
  session: null,
  loginEmail: "", loginPass: "", loginError: "",
};

const BASE = location.origin;
let render;

const api = async (path, opts = {}) => {
  const headers = { "Content-Type": "application/json", apikey: "local", ...(S.session ? { Authorization: `Bearer ${S.session.access_token}` } : {}) };
  try {
    const r = await fetch(BASE + path, { ...opts, headers: { ...headers, ...opts.headers } });
    const j = await r.json();
    log(`${opts.method || "GET"} ${path}`, j);
    return j;
  } catch(e) { log("ERROR", e.message); return { error: { message: e.message } }; }
};

const toast = (msg, kind = "info") => {
  const id = Date.now();
  S.toasts.push({ id, msg, kind });
  render();
  setTimeout(() => { S.toasts = S.toasts.filter(t => t.id !== id); render(); }, 3000);
};

const log = (label, data) => {
  S.logs.unshift({ ts: new Date().toLocaleTimeString(), label, data: JSON.stringify(data, null, 2) });
  if (S.logs.length > 50) S.logs.pop();
};

const load = async (table) => {
  S.activeTable = table; S.loading = true; render();
  const r = await api(`/rest/v1/${table}?count=exact`);
  S.rows = r.data || [];
  S.schema = S.rows.length ? Object.keys(S.rows[0]) : [];
  S.loading = false; render();
};

const loadTables = async () => {
  const stored = localStorage.getItem("_bb_gui_tables");
  S.tables = stored ? JSON.parse(stored) : [];
  render();
};

const saveTables = () => localStorage.setItem("_bb_gui_tables", JSON.stringify(S.tables));

const addTable = async (name) => {
  if (!name || S.tables.includes(name)) return;
  S.tables.push(name); saveTables();
  await load(name);
};

const removeTable = (name) => {
  S.tables = S.tables.filter(t => t !== name);
  if (S.activeTable === name) { S.activeTable = S.tables[0] || null; S.rows = []; S.schema = []; }
  saveTables(); render();
};

const tryLogin = async () => {
  const r = await api("/auth/v1/token", { method: "POST", body: JSON.stringify({ email: S.loginEmail, password: S.loginPass }) });
  if (r.error) { S.loginError = r.error.message; render(); return; }
  S.session = r.data?.session || r;
  S.loginError = ""; render();
};

const tryKeypairLogin = async () => {
  const kpRaw = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
  const [pub, priv] = await Promise.all([
    crypto.subtle.exportKey("raw", kpRaw.publicKey),
    crypto.subtle.exportKey("pkcs8", kpRaw.privateKey),
  ]);
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const pubkey = b64(pub), privkey = b64(priv);
  localStorage.setItem("_bb_pubkey", pubkey); localStorage.setItem("_bb_privkey", privkey);
  const nr = await api("/auth/v1/keypair");
  const nonce = nr.data?.nonce;
  const sig = b64(await crypto.subtle.sign("Ed25519", kpRaw.privateKey, new TextEncoder().encode(nonce)));
  const r = await api("/auth/v1/keypair", { method: "POST", body: JSON.stringify({ pubkey, nonce, signature: sig }) });
  if (r.error) { S.loginError = r.error.message; render(); return; }
  S.session = r.data?.session || r; S.loginError = ""; render();
};

const tryRestoreKeypair = async () => {
  const pubkey = localStorage.getItem("_bb_pubkey"), privkey = localStorage.getItem("_bb_privkey");
  if (!pubkey || !privkey) return false;
  const nr = await api("/auth/v1/keypair");
  const nonce = nr.data?.nonce;
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const privCrypto = await crypto.subtle.importKey("pkcs8", unb64(privkey), { name: "Ed25519" }, false, ["sign"]);
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const sig = b64(await crypto.subtle.sign("Ed25519", privCrypto, new TextEncoder().encode(nonce)));
  const r = await api("/auth/v1/keypair", { method: "POST", body: JSON.stringify({ pubkey, nonce, signature: sig }) });
  if (r.data?.session) { S.session = r.data.session; render(); return true; }
  return false;
};

const DataTab = () => {
  const cols = S.schema.filter(c => c !== "vector");
  const filtered = S.filter
    ? S.rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(S.filter.toLowerCase())))
    : S.rows;

  const insertRow = async () => {
    if (!S.activeTable || !Object.keys(S.newRow).length) return;
    const r = await api(`/rest/v1/${S.activeTable}`, { method: "POST", body: JSON.stringify(S.newRow) });
    if (r.error) { toast(r.error.message, "danger"); return; }
    S.newRow = {}; toast("Inserted"); await load(S.activeTable);
  };

  const deleteRow = async (row) => {
    await api(`/rest/v1/${S.activeTable}?eq.id=${row.id}`, { method: "DELETE" });
    toast("Deleted"); await load(S.activeTable);
  };

  const saveCell = async (row, col, val) => {
    await api(`/rest/v1/${S.activeTable}?eq.id=${row.id}`, { method: "PATCH", body: JSON.stringify({ [col]: val }) });
    S.editCell = null; toast("Saved"); await load(S.activeTable);
  };

  return h("div", { style: "display:flex;gap:1rem;height:100%" },
    h("div", { style: "width:12rem;flex-shrink:0" },
      h("div", { style: "display:flex;gap:.5rem;margin-bottom:.75rem" },
        TextField({ value: S.newTableName, placeholder: "table name", key: "new-tbl",
          onInput: v => { S.newTableName = v; } }),
        Btn({ variant: "primary", size: "sm", onClick: () => { addTable(S.newTableName); S.newTableName = ""; render(); }, children: "+" }),
      ),
      S.tables.map(t => h("div", { key: t, class: `bb-nav-item ${t === S.activeTable ? "active" : ""}`,
          style: "display:flex;justify-content:space-between;align-items:center",
          onclick: () => load(t) },
        h("span", null, t),
        h("span", { style: "font-size:.75rem;opacity:.5", onclick: e => { e.stopPropagation(); removeTable(t); } }, "x")
      ))
    ),
    h("div", { style: "flex:1;overflow:auto" },
      !S.activeTable
        ? h("div", { key: "empty-state", style: "opacity:.6;margin-top:2rem;text-align:center" }, "Add a table name to get started")
        : h("div", { key: "table-view" },
            h("div", { style: "display:flex;gap:.5rem;margin-bottom:.75rem;align-items:center" },
              TextField({ value: S.filter, placeholder: "filter...", key: "filter",
                onInput: v => { S.filter = v; render(); } }),
              Btn({ variant: "ghost", size: "sm", onClick: () => load(S.activeTable), children: "Refresh" }),
              h("span", { style: "font-size:.85rem;opacity:.7" }, `${filtered.length} rows`),
            ),
            S.loading
              ? h("div", { style: "padding:2rem;text-align:center" }, "Loading...")
              : h("div", { style: "overflow-x:auto" },
                  h("table", { class: "bb-editable-table" },
                    h("thead", null, h("tr", null,
                      ...cols.map(c => h("th", { key: c }, c)),
                      h("th", null, "")
                    )),
                    h("tbody", null,
                      h("tr", null,
                        ...cols.map(c => h("td", { key: c },
                          h("input", { class: "bb-cell-edit", placeholder: c, value: S.newRow[c] || "",
                            oninput: e => { S.newRow[c] = e.target.value; } })
                        )),
                        h("td", null, Btn({ variant: "primary", size: "sm", onClick: insertRow, children: "Add" }))
                      ),
                      ...filtered.map(row => h("tr", { key: row.id },
                        ...cols.map(col => {
                          const editing = S.editCell?.row === row.id && S.editCell?.col === col;
                          return h("td", { key: col, ondblclick: () => { S.editCell = { row: row.id, col }; render(); } },
                            editing
                              ? h("input", { class: "bb-cell-edit", value: row[col] ?? "",
                                  onblur: e => saveCell(row, col, e.target.value),
                                  onkeydown: e => e.key === "Enter" && saveCell(row, col, e.target.value),
                                  ref: el => el?.focus() })
                              : h("span", null, String(row[col] ?? ""))
                          );
                        }),
                        h("td", null, Btn({ variant: "danger", size: "sm", onClick: () => deleteRow(row), children: "Delete" }))
                      ))
                    )
                  )
                )
          )
    )
  );
};

const AuthTab = () => {
  const exportKey = () => {
    const pk = localStorage.getItem("_bb_privkey"), pub = localStorage.getItem("_bb_pubkey");
    if (!pk) { toast("No keypair found", "warning"); return; }
    navigator.clipboard?.writeText(JSON.stringify({ privkey: pk, pubkey: pub }));
    toast("Keypair copied to clipboard");
  };

  const importKey = async () => {
    const raw = prompt("Paste keypair JSON:");
    if (!raw) return;
    try {
      const { privkey, pubkey } = JSON.parse(raw);
      localStorage.setItem("_bb_privkey", privkey); localStorage.setItem("_bb_pubkey", pubkey);
      await tryRestoreKeypair(); toast("Keypair restored");
    } catch { toast("Invalid keypair", "danger"); }
  };

  return h("div", { style: "max-width:32rem" },
    S.session
      ? h("div", { style: "display:flex;flex-direction:column;gap:1rem" },
          Alert({ kind: "success", children: "Signed in as: " + (S.session.user?.email || S.session.user?.id || "anonymous") }),
          Panel({ title: "Session", children:
            h("div", null,
              h("pre", null, JSON.stringify(S.session.user, null, 2)),
              h("div", { style: "display:flex;gap:.5rem" },
                Btn({ variant: "default", size: "sm", onClick: exportKey, children: "Export keypair" }),
                Btn({ variant: "ghost", size: "sm", onClick: importKey, children: "Import keypair" }),
                Btn({ variant: "danger", size: "sm", onClick: async () => {
                  await api("/auth/v1/logout", { method: "POST" });
                  S.session = null; render();
                }, children: "Sign out" }),
              )
            )
          })
        )
      : h("div", { style: "display:flex;flex-direction:column;gap:1rem" },
          Panel({ title: "Anonymous (keypair)", children:
            h("div", null,
              h("p", { style: "font-size:.85rem;opacity:.7" }, "No signup required. Your keypair is your identity."),
              h("div", { style: "display:flex;gap:.5rem" },
                Btn({ variant: "primary", onClick: async () => { await tryKeypairLogin(); loadTables(); }, children: "Sign in anonymously" }),
                Btn({ variant: "ghost", onClick: importKey, children: "Restore from key" }),
              )
            )
          }),
          Panel({ title: "Email / Password", children:
            h("div", { style: "display:flex;flex-direction:column;gap:.5rem" },
              S.loginError && Alert({ kind: "danger", children: S.loginError }),
              TextField({ label: "Email", type: "email", value: S.loginEmail,
                onInput: v => { S.loginEmail = v; } }),
              TextField({ label: "Password", type: "password", value: S.loginPass,
                onInput: v => { S.loginPass = v; } }),
              h("div", { style: "display:flex;gap:.5rem" },
                Btn({ variant: "primary", onClick: tryLogin, children: "Sign in" }),
                Btn({ variant: "ghost", onClick: async () => {
                  const r = await api("/auth/v1/signup", { method: "POST", body: JSON.stringify({ email: S.loginEmail, password: S.loginPass }) });
                  if (r.error) { S.loginError = r.error.message; render(); } else { toast("Account created — sign in"); }
                }, children: "Sign up" }),
              )
            )
          })
        )
  );
};

const ApiTab = () => {
  const examples = [
    ["GET all rows", () => S.activeTable ? `GET /rest/v1/${S.activeTable}` : "GET /rest/v1/mytable"],
    ["Filter eq",   () => `GET /rest/v1/${S.activeTable || "mytable"}?eq.id=1`],
    ["Insert",      () => `POST /rest/v1/${S.activeTable || "mytable"}\n${JSON.stringify({ name: "Alice", score: 10 }, null, 2)}`],
    ["Update",      () => `PATCH /rest/v1/${S.activeTable || "mytable"}?eq.id=1\n${JSON.stringify({ name: "Bob" }, null, 2)}`],
    ["Delete",      () => `DELETE /rest/v1/${S.activeTable || "mytable"}?eq.id=1`],
    ["Sign up",     () => `POST /auth/v1/signup\n${JSON.stringify({ email: "user@example.com", password: "secret" }, null, 2)}`],
    ["Sign in",     () => `POST /auth/v1/token\n${JSON.stringify({ email: "user@example.com", password: "secret" }, null, 2)}`],
    ["Get user",    () => `GET /auth/v1/user`],
    ["Keypair nonce", () => `GET /auth/v1/keypair`],
    ["Vector search", () => `GET /rest/v1/${S.activeTable || "embeddings"}?vec=[1,0,0,0]&limit=5`],
  ];

  const run = async () => {
    const lines = S.sql.trim().split("\n");
    const [method, path] = lines[0].split(" ");
    const body = lines.slice(1).join("\n").trim();
    const opts = { method };
    if (body) { try { opts.body = JSON.stringify(JSON.parse(body)); } catch { opts.body = body; } }
    const r = await api(path, opts);
    S.sqlResult = r; render();
  };

  return h("div", { style: "display:flex;flex-direction:column;gap:1rem;max-width:42rem" },
    h("div", { style: "display:flex;flex-wrap:wrap;gap:.5rem" },
      ...examples.map(([label, fn]) => Btn({ key: label, variant: "ghost", size: "sm",
        onClick: () => { S.sql = fn(); S.sqlResult = null; render(); }, children: label }))
    ),
    h("textarea", { style: "font-family:monospace;font-size:.85rem;height:8rem;width:100%;box-sizing:border-box;padding:.5rem", placeholder: "METHOD /path\n{body json}", value: S.sql,
      oninput: e => { S.sql = e.target.value; } }),
    Btn({ variant: "primary", onClick: run, children: "Run" }),
    S.sqlResult && h("pre", null, JSON.stringify(S.sqlResult, null, 2))
  );
};

const LogsTab = () =>
  h("div", { style: "display:flex;flex-direction:column;gap:.5rem" },
    h("div", { style: "margin-bottom:.5rem" },
      Btn({ variant: "ghost", size: "sm", onClick: () => { S.logs = []; render(); }, children: "Clear" })
    ),
    ...S.logs.map((l, i) => Panel({ key: i, title: `${l.ts} — ${l.label}`, children:
      h("pre", { style: "max-height:10rem" }, l.data)
    }))
  );

const TABS = [
  ["data", "Data", DataTab],
  ["auth", "Auth", AuthTab],
  ["api", "API Explorer", ApiTab],
  ["logs", "Logs", LogsTab],
];

const App = () => AppShell({
  topbar: Topbar({
    brand: "BusyBase",
    items: TABS.map(([id, label]) => [label, `#${id}`]),
    active: TABS.find(([id]) => id === S.tab)?.[1] || "",
    onNav: (label) => { const found = TABS.find(([, l]) => l === label); if (found) { S.tab = found[0]; render(); } },
  }),
  side: Side({
    sections: [{
      group: "Views",
      items: TABS.map(([id, label]) => ({
        label, active: id === S.tab,
        onClick: (e) => { e.preventDefault(); S.tab = id; render(); },
        href: `#${id}`,
      })),
    }],
  }),
  main: h("div", null,
    (TABS.find(([id]) => id === S.tab)?.[2] || DataTab)(),
    h("div", { class: "bb-toasts" },
      ...S.toasts.map(t => Alert({ key: t.id, kind: t.kind, children: t.msg }))
    )
  ),
  status: S.session ? h("span", null, S.session.user?.email || "anonymous") : null,
});

initTheme();
render = mount(document.getElementById("app"), () => App());
loadTables();
tryRestoreKeypair();
</script>
</body>
</html>
